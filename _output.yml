bookdown::gitbook:
  css: ["style.css", "modern.css"]
  highlight: tango
  includes:
    after_body: includes/author-footer.html
  config:
    sharing:
      github: yes
      facebook: yes
      twitter: yes
      linkedin: yes
    toc:
      collapse: subsection
      before: |
        <li><a class="pa-brand" href="https://www.predictiveInsightsAI.com">Predictive Insights AI</a></li>
      after: |
        <li><a href="https://www.predictiveInsightsAI.com">More learning resources</a></li>
        <li><a href="https://www.linkedin.com/in/samdcastillo/">Connect with Sam Castillo</a></li>
bookdown::pdf_book:
  dev: "cairo_pdf"
  toc_unnumbered: yes
  toc_depth: 2
  includes:
    in_header: preamble.tex
  latex_engine: xelatex
  citation_package: natbib
  keep_tex: yes
bookdown::epub_book: default
