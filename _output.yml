bookdown::gitbook:
  css: ["style.css", "assets/css/space-vibe.css"]
  highlight: tango
  config:
    sharing:
      github: yes
      facebook: yes
      twitter: yes
      linkedin: yes
    toc:
      collapse: subsection
            before: |
        <li><a href="https://www.PredictiveInsightsAI.com"><b>Predictive Insights AI</b></a></li>
        <center><li><a href="https://www.PredictiveInsightsAI.com" class="btn btn-primary" style="margin:10px; color:white; background-color:#007bff; padding:5px 10px; border-radius:5px; text-decoration:none;">Contact Sales</a></li></center>
      after: |
        <li><a href="https://www.PredictiveInsightsAI.com">Visit My Main Site</a></li>
      bookdown::pdf_book:
  dev: "cairo_pdf"
  toc_unnumbered: yes
  toc_depth: 2
  includes:
    in_header: preamble.tex
  latex_engine: xelatex
  citation_package: natbib
  keep_tex: yes
bookdown::epub_book: default
output_dir: "docs"
